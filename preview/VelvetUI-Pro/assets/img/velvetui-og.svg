<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Velvet Studio social preview</title>
  <desc id="desc">Velvet Studio editorial Open Graph image featuring the brand name and a layered geometric mark.</desc>
  <rect width="1200" height="630" fill="#090113"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="136" r="190" fill="#D6B67A" fill-opacity="0.16"/>
  <circle cx="180" cy="528" r="230" fill="#FF5B9F" fill-opacity="0.12"/>
  <rect x="72" y="72" width="1056" height="486" rx="38" stroke="rgba(255, 208, 227, 0.22)" stroke-width="2"/>
  <rect x="118" y="118" width="404" height="394" rx="32" fill="#13031E"/>
  <rect x="144" y="144" width="352" height="342" rx="26" stroke="#F0C47A" stroke-opacity="0.68" stroke-width="1.5"/>
  <path d="M320 190L424 302L320 416L216 302L320 190Z" fill="url(#mark)" filter="url(#glow)"/>
  <path d="M282 302H358" stroke="#120217" stroke-width="6" stroke-linecap="round"/>
  <path d="M320 264V340" stroke="#120217" stroke-width="6" stroke-linecap="round"/>
  <text x="580" y="246" fill="#FFF7FB" font-family="Georgia, serif" font-size="88" letter-spacing="8">VELVET</text>
  <text x="580" y="324" fill="#FFD0E3" font-family="Arial, sans-serif" font-size="30" letter-spacing="10">STUDIO</text>
  <text x="580" y="404" fill="#EBDCE5" font-family="Arial, sans-serif" font-size="35">
    Interiors shaped through warmth, texture, and calm utility.
  </text>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1068" y2="688" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05000B"/>
      <stop offset="0.38" stop-color="#13031E"/>
      <stop offset="0.72" stop-color="#220532"/>
      <stop offset="1" stop-color="#080010"/>
    </linearGradient>
    <linearGradient id="mark" x1="216" y1="190" x2="424" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7FB"/>
      <stop offset="0.44" stop-color="#FFC7DE"/>
      <stop offset="1" stop-color="#FF4D94"/>
    </linearGradient>
    <filter id="glow" x="176" y="150" width="288" height="306" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feFlood flood-opacity="0" result="BackgroundImageFix"/>
